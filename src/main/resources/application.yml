# 기본 설정 (로컬 개발). DB 접속 정보는 환경변수나 application-local.yml(깃에 올리지 않음)로 덮어쓴다.
server:
  port: 8080
  servlet:
    session:
      timeout: 30m                 # 마지막 요청부터 30분 (명세 공통 규칙)
      cookie:
        http-only: true
        same-site: lax
  tomcat:
    max-swallow-size: 10MB         # 5MB 넘는 업로드에도 연결을 끊지 않고 IMAGE_INVALID 응답을 보내기 위함

spring:
  config:
    import: optional:file:./src/main/resources/application-local.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lostfound?connectionTimeZone=%2B09:00&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate           # 테이블은 db/schema.sql로 만든다. 엔티티와 다르면 서버가 뜨지 않는다
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

app:
  upload-dir: ./uploads            # 이미지 저장 폴더. /uploads/파일명 으로 서빙
  demo-mode: true                  # 시연 모드: 이동 가능 요청에 GPS 대신 buildingId 허용
  data-dir: ./data                 # 건물·보행 그래프 CSV 폴더
  seed-enabled: true               # 빈 DB에 카테고리·관리자·테스트 학생·건물 넣기

logging:
  level:
    org.hibernate.SQL: info        # SQL을 보고 싶으면 debug
