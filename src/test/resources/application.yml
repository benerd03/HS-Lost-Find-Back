# 테스트: H2(MySQL 호환 모드) 메모리 DB. 테이블은 엔티티로 자동 생성한다.
spring:
  datasource:
    url: jdbc:h2:mem:lostfound;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  upload-dir: ./build/test-uploads
  demo-mode: true
  data-dir: ./data
  seed-enabled: true
